name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for manual build artifacts
        required: false
        type: string
      publish_release:
        description: Publish Docker images and GitHub release artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOCKER_IMAGE: aleda145/kavla
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_GTK_COMMIT: 7a3fbc31a9e5075073ff8790f26effbac5f84453
  APPIMAGE_RUNTIME_VERSION: "20251108"

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ github.event.inputs.version }}"
            if [[ "${{ inputs.publish_release }}" == "true" && -z "$version" ]]; then
              echo "version is required when publish_release is enabled" >&2
              exit 1
            fi
            if [[ -z "$version" ]]; then
              version="manual-${GITHUB_SHA::7}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test CLI
        working-directory: cli
        run: go test ./...

  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [meta, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - name: Install Wails Linux dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y file libgirepository1.0-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install app dependencies
        working-directory: app
        run: yarn install --frozen-lockfile
      - name: Build self-contained CLI binary
        working-directory: cli
        env:
          COMMIT: ${{ needs.meta.outputs.commit }}
          BUILD_DATE: ${{ needs.meta.outputs.build_date }}
        run: ./scripts/build-release.sh "${{ needs.meta.outputs.version }}" "${{ matrix.goos }}" "${{ matrix.goarch }}" build
      - name: Package CLI release assets
        working-directory: cli
        run: ./scripts/package-release.sh "${{ needs.meta.outputs.version }}" "${{ matrix.goos }}" "${{ matrix.goarch }}" build dist
      - name: Build Wails desktop binary
        working-directory: cli
        env:
          COMMIT: ${{ needs.meta.outputs.commit }}
          BUILD_DATE: ${{ needs.meta.outputs.build_date }}
        run: ./scripts/build-wails-release.sh "${{ needs.meta.outputs.version }}" "${{ matrix.goos }}" "${{ matrix.goarch }}" desktop-build
      - name: Download AppImage packaging tools
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.goarch }}" in
            amd64)
              tool_arch=x86_64
              tool_sha256=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
              runtime_sha256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
              ;;
            arm64)
              tool_arch=aarch64
              tool_sha256=620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
              runtime_sha256=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
              ;;
            *) echo "unsupported AppImage architecture: ${{ matrix.goarch }}" >&2; exit 1 ;;
          esac
          tools_dir="${{ github.workspace }}/cli/build/appimage-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-${tool_arch}.AppImage" \
            --output "$tools_dir/linuxdeploy.AppImage"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh" \
            --output "$tools_dir/linuxdeploy-plugin-gtk.sh"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${tool_arch}" \
            --output "$tools_dir/runtime"
          printf '%s  %s\n' "$tool_sha256" "$tools_dir/linuxdeploy.AppImage" | sha256sum --check -
          printf '%s  %s\n' b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171 "$tools_dir/linuxdeploy-plugin-gtk.sh" | sha256sum --check -
          printf '%s  %s\n' "$runtime_sha256" "$tools_dir/runtime" | sha256sum --check -
          chmod +x "$tools_dir/linuxdeploy.AppImage" "$tools_dir/linuxdeploy-plugin-gtk.sh"
      - name: Build Linux AppImage
        if: matrix.goos == 'linux'
        env:
          COMMIT: ${{ needs.meta.outputs.commit }}
          BUILD_DATE: ${{ needs.meta.outputs.build_date }}
        run: >-
          ./cli/scripts/build-linux-appimage.sh
          "${{ needs.meta.outputs.version }}"
          "${{ github.workspace }}/cli/desktop-build/kavla"
          "${{ github.workspace }}/cli/build/appimage-tools/linuxdeploy.AppImage"
          "${{ github.workspace }}/cli/build/appimage-tools/runtime"
      - name: Package macOS desktop release asset
        if: matrix.goos == 'darwin'
        working-directory: cli
        run: ./scripts/package-wails-release.sh "${{ needs.meta.outputs.version }}" "${{ matrix.goos }}" "${{ matrix.goarch }}" desktop-build dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/kavla*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: docker-${{ matrix.arch }}
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [meta, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            KAVLA_VERSION=${{ needs.meta.outputs.version }}
            KAVLA_COMMIT=${{ needs.meta.outputs.commit }}
            KAVLA_BUILD_DATE=${{ needs.meta.outputs.build_date }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}-v2
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}-v2
      - name: Export image digest
        shell: bash
        run: |
          mkdir -p /tmp/docker-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/docker-digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/docker-digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [meta, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: /tmp/docker-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and publish multi-platform manifest
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for digest_file in /tmp/docker-digests/*; do
            refs+=("${DOCKER_IMAGE}@sha256:$(basename "$digest_file")")
          done
          docker buildx imagetools create \
            --tag "${DOCKER_IMAGE}:${{ needs.meta.outputs.version }}" \
            --tag "${DOCKER_IMAGE}:latest" \
            "${refs[@]}"
      - name: Inspect multi-platform manifest
        run: docker buildx imagetools inspect "${DOCKER_IMAGE}:${{ needs.meta.outputs.version }}"

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [meta, build, docker-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add license notices
        run: cp LICENSE THIRD_PARTY_LICENSES.md TLDRAW_LICENSE.md dist/
      - name: Create checksums
        working-directory: dist
        run: sha256sum ./* > kavla_${{ needs.meta.outputs.version }}_checksums.txt
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ needs.meta.outputs.version }}" >/dev/null 2>&1; then
            gh release create "${{ needs.meta.outputs.version }}" --verify-tag --generate-notes --title "${{ needs.meta.outputs.version }}"
          fi
      - name: Remove legacy release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ needs.meta.outputs.version }}" --json assets --jq '.assets[].name | select(endswith(".tar.gz"))' |
            while IFS= read -r asset; do
              gh release delete-asset "${{ needs.meta.outputs.version }}" "$asset" --yes
            done
      - name: Upload release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.meta.outputs.version }}" dist/* --clobber
      - name: Look up release timestamp
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_at=$(gh release view "${{ needs.meta.outputs.version }}" --json publishedAt --jq '.publishedAt')
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
      - name: Generate updater manifest
        run: |
          python3 ./cli/scripts/generate_latest_manifest.py \
            --version "${{ needs.meta.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --dist-dir dist \
            --published-at "${{ steps.release_meta.outputs.published_at }}" \
            --notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.meta.outputs.version }}"
      - name: Upload updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.meta.outputs.version }}" dist/kavla_latest.json --clobber
