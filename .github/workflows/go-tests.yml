name: Go tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test CLI
        working-directory: cli
        run: go test ./...
      - name: Test CEF backend
        working-directory: cli
        run: go test -tags cef ./cmd ./internal/localapp
